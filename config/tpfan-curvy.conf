# /etc/tpfan-curvy.conf — configuration for the curvy-tpfan fan daemon.
# SPDX-License-Identifier: MIT
#
# This file is shell-sourced by tpfan-curvy. After editing:
#   sudo systemctl restart tpfan-curvy
# Validate without touching the fan (prints resolved sensors + curve table):
#   tpfan-curvy --check

# ---- preset: quiet | normal | aggressive --------------------------------
# Sets the critical temperature, curve span, and hysteresis. 'normal' is the
# safe default. 'aggressive' ramps earlier (cooler, louder); 'quiet' ramps
# later (softer, hotter — leans harder on the critical override). Any explicit
# value in the "fine tuning" block below overrides the preset.
#
#   preset       crit   curve span    hyst
#   quiet         92    55 -> 88 °C    6
#   normal        90    48 -> 82 °C    5
#   aggressive    85    40 -> 75 °C    4
PRESET=normal

# ---- mode source --------------------------------------------------------
# platform_profile : kernel ACPI interface (recommended; works regardless of
#                    desktop environment or power daemon — ppd/tuned/asusctl
#                    all write here).
# ppd              : poll power-profiles-daemon directly (for older ThinkPads
#                    that predate the DYTC platform_profile interface).
MODE_SOURCE=platform_profile

# ---- fine tuning (uncomment to override the preset) ---------------------
#POLL=2          # seconds between samples
#CRIT=90         # >= this temp -> DISENGAGE (full speed), every mode
#CRIT_HYST=5     # resume the curve only once temp drops below CRIT-CRIT_HYST
#TEMP_LO=48      # at/below this temp -> band MIN
#TEMP_HI=82      # at/above this temp -> band MAX
#HYST=5          # downshift deadband (°C); upshift is always immediate

# ---- per-mode EC level bands "MIN MAX" (levels 0..7, ~14% per level) -----
# The fan never leaves a mode's band; the curve moves it between MIN and MAX
# across [TEMP_LO, TEMP_HI]. Keys are the power-mode tokens — platform_profile
# uses low-power/balanced/performance; ppd uses power-saver/balanced/performance.
# Run `tpfan-curvy --check` to see your machine's actual profile choices.
# Uncomment to override the built-in defaults:
#BAND["performance"]="7 7"    # ~90-100%
#BAND["balanced"]="2 7"       # ~25-100%
#BAND["low-power"]="0 2"      # ~0-35%  (fan may be fully OFF when cool)
#BAND["power-saver"]="0 2"    # ppd alias for low-power
