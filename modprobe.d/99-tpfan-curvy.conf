# curvy-tpfan — enable thinkpad_acpi manual fan control.
# SPDX-License-Identifier: MIT
#
# thinkpad_acpi exposes the fan PWM read-only by default. tpfan-curvy needs
# write access. This option grants it; it takes effect after a reboot (the
# module has too many in-use dependencies to reload live).
#
# Upstream prints "fan_control enabled, use at your own risk" to the kernel log
# on load — that is expected, not an error.
options thinkpad_acpi fan_control=1
